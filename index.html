const { useState, useEffect, useRef, useCallback } = React;

/* ---------------- Scroll reveal hook ---------------- */
function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.scroll-fade');
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          e.target.classList.add('in-view');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.15 });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
}

/* ---------------- Neural network hero canvas ---------------- */
function NeuralCanvas() {
  const canvasRef = useRef(null);
  const mouseRef = useRef({ x: -9999, y: -9999 });

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    let width, height, dpr;
    let nodes = [];
    let raf;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = canvas.parentElement.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const count = Math.max(18, Math.floor((width * height) / 26000));
      nodes = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        r: Math.random() * 1.6 + 1,
      }));
    }

    function step() {
      ctx.clearRect(0, 0, width, height);
      const mx = mouseRef.current.x, my = mouseRef.current.y;

      for (const n of nodes) {
        if (!reduceMotion) {
          n.x += n.vx;
          n.y += n.vy;
          if (n.x < 0 || n.x > width) n.vx *= -1;
          if (n.y < 0 || n.y > height) n.vy *= -1;
        }
      }

      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const maxDist = 130;
          if (dist < maxDist) {
            const opacity = (1 - dist / maxDist) * 0.22;
            ctx.strokeStyle = `rgba(139,124,246,${opacity})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      for (const n of nodes) {
        const dx = n.x - mx, dy = n.y - my;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const near = dist < 160;
        ctx.beginPath();
        ctx.arc(n.x, n.y, near ? n.r + 1 : n.r, 0, Math.PI * 2);
        ctx.fillStyle = near ? 'rgba(79,209,174,0.9)' : 'rgba(231,236,243,0.55)';
        ctx.fill();

        if (near) {
          ctx.strokeStyle = `rgba(79,209,174,${(1 - dist / 160) * 0.35})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(n.x, n.y);
          ctx.lineTo(mx, my);
          ctx.stroke();
        }
      }

      raf = requestAnimationFrame(step);
    }

    resize();
    step();
    window.addEventListener('resize', resize);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }, []);

  const handleMove = useCallback((e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    mouseRef.current = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }, []);
  const handleLeave = useCallback(() => { mouseRef.current = { x: -9999, y: -9999 }; }, []);
  const handleTouch = useCallback((e) => {
    if (!e.touches[0]) return;
    const rect = e.currentTarget.getBoundingClientRect();
    mouseRef.current = { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
  }, []);

  return (
    <div
      className="absolute inset-0"
      onMouseMove={handleMove}
      onMouseLeave={handleLeave}
      onTouchMove={handleTouch}
      onTouchEnd={handleLeave}
    >
      <canvas ref={canvasRef} className="w-full h-full" />
    </div>
  );
}

/* ---------------- Hero ---------------- */
function Hero() {
  const roles = ['learning AI & ML', 'building small tools', 'writing my first algorithms', 'exploring software dev'];
  const [roleIdx, setRoleIdx] = useState(0);
  const [display, setDisplay] = useState('');
  const [deleting, setDeleting] = useState(false);

  useEffect(() => {
    const full = roles[roleIdx];
    const speed = deleting ? 35 : 55;
    const timer = setTimeout(() => {
      if (!deleting) {
        const next = full.slice(0, display.length + 1);
        setDisplay(next);
        if (next === full) setTimeout(() => setDeleting(true), 1400);
      } else {
        const next = full.slice(0, display.length - 1);
        setDisplay(next);
        if (next === '') {
          setDeleting(false);
          setRoleIdx((i) => (i + 1) % roles.length);
        }
      }
    }, speed);
    return () => clearTimeout(timer);
  }, [display, deleting, roleIdx]);

  return (
    <section id="top" className="relative pt-32 pb-24 sm:pt-40 sm:pb-32 overflow-hidden">
      <div className="absolute inset-0 h-[560px]">
        <NeuralCanvas />
        <div className="absolute inset-0" style={{ background: 'linear-gradient(180deg, transparent 0%, var(--bg) 92%)' }}></div>

      <div className="relative max-w-6xl mx-auto px-5 sm:px-8">
        <div className="max-w-2xl">
          <p className="font-mono text-sm mb-5" style={{ color: 'var(--mint)' }}>
            Purwokerto, Indonesia — Informatics '26
          </p>
          <h1 className="font-display font-semibold leading-[1.05] text-[clamp(2.2rem,6vw,3.75rem)] tracking-tight">
            Rafi Fat&rsquo;a Azhallah
          </h1>

            Informatics freshman, currently <span style={{ color: 'var(--ink)' }}>{display}</span>
            <span className="track-caret">&nbsp;</span>
          </p>
          <p className="mt-6 text-base leading-relaxed max-w-xl" style={{ color: 'var(--ink-dim)' }}>
            First-year student at Telkom University Purwokerto with a growing interest in artificial intelligence,
            machine learning, and software development. I don&rsquo;t have years of experience &mdash; I have a
            notebook full of things I&rsquo;m trying to understand, and I&rsquo;m documenting the process here.
          </p>

          <div className="mt-10 flex flex-wrap items-center gap-4">
            <a

              style={{ background: 'var(--violet)', color: '#0A0C12' }}

              style={{ color: 'var(--ink)' }}

        </div>
      </div>
    </section>
  );
}
